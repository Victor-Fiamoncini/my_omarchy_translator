# Run `mise tasks` to list, `mise run <task>` to execute.

# mise.toml wins over .tool-versions, which stays for asdf users: keep the
# two Ruby versions in sync.
[tools]
ruby = "4.0.2"

[tasks.setup]
description = "Install development gems (RuboCop, Minitest, SimpleCov, bundler-audit)"
run = "bundle install"

[tasks.test]
description = "Run the Ruby test suite"
run = "bundle exec rake test"

[tasks.lint]
description = "Run RuboCop"
run = "bundle exec rubocop"

[tasks."lint:fix"]
description = "Autocorrect safe RuboCop offenses"
run = "bundle exec rubocop -a"

[tasks."lint:qml"]
description = "Lint QML with qmllint against the Omarchy shell modules"
run = "script/lint-qml"

[tasks."test:qml"]
description = "Run the QML tests (PanelLogic, Panel and BarWidget) with qmltestrunner"
run = "script/test-qml"

[tasks.validate]
description = "Validate the Omarchy plugin manifest"
run = "omarchy plugin validate ."

[tasks."test:coverage"]
description = "Run the Ruby test suite with line and branch coverage (coverage/index.html)"
run = "COVERAGE=1 bundle exec rake test"

[tasks.format]
description = "Check .editorconfig formatting on the files RuboCop doesn't cover"
run = "script/check-format"

[tasks.audit]
description = "Audit the dev gems for known vulnerabilities"
run = "bundle exec bundle-audit check --update"

[tasks.check]
description = "Every quality gate (bin/ci): style, format, audit, tests + coverage, QML tests, manifest"
run = "bin/ci"

[tasks.ci]
description = "Alias of check"
run = "bin/ci"

[tasks.reload]
description = "Restart the Omarchy shell so QML edits take effect"
run = "omarchy-restart-shell"
